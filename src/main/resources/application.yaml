spring:
  jpa:
    properties:
      hibernate:
        ddl-auto: update
        show-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  server:
    port: 8080
